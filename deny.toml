# The dependency policy `cargo deny check` holds: advisories, licences, bans and sources.

[graph]
all-features = true

[advisories]
# A vulnerability is always an error; so is a crate its maintainers have left, an unsound one, or
# a version crates.io withdrew, wherever it sits in the graph.
unmaintained = "all"
unsound = "all"
yanked = "deny"

[licenses]
# The project is under Apache-2.0 or MPL-2.0, and a program of any licence, proprietary included,
# can take it. So a dependency is under a permissive licence below, whose terms carrying its
# notices meets, or under MPL-2.0, whose copyleft stays with the dependency's own files; a crate
# offering a choice is admitted by any one of them, and every other licence is refused. The
# project's own crates pass here under either of its two licences.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "BlueOak-1.0.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
# A workspace member is named by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# `windows-reactor` and its setup crate, followed on `master` at the commit `Cargo.lock` names.
allow-git = ["https://github.com/microsoft/windows-rs"]
